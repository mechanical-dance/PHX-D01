<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c2c2f"/>
      <stop offset="1" stop-color="#121213"/>
    </linearGradient>
    <linearGradient id="ember" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8f1a0a"/>
      <stop offset="0.5" stop-color="#e4572e"/>
      <stop offset="1" stop-color="#ffd36a"/>
    </linearGradient>
    <linearGradient id="liquid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff9a4a"/>
      <stop offset="1" stop-color="#9c1c0c"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#ffd36a" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#ffd36a" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="body"><path d="M474 480 L 474 520 L 340 790 Q 330 812 354 812 L 670 812 Q 694 812 684 790 L 550 520 L 550 480 Z"/></clipPath>
    <clipPath id="vane"><path d="M-215 4 C -150 -40, -40 -62, 80 -54 C 150 -48, 196 -30, 222 -4 C 190 22, 120 44, 30 46 C -70 48, -160 34, -215 4 Z"/></clipPath>
    <path id="spark" d="M0 -1 L 0.2 -0.2 L 1 0 L 0.2 0.2 L 0 1 L -0.2 0.2 L -1 0 L -0.2 -0.2 Z"/>
  </defs>

  <!-- tile -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#tile)"/>
  <rect x="104" y="104" width="816" height="816" rx="182" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="4"/>
  <g fill="#0b0b0c" stroke="#47474b" stroke-width="3">
    <circle cx="190" cy="190" r="15"/><circle cx="834" cy="190" r="15"/>
    <circle cx="190" cy="834" r="15"/><circle cx="834" cy="834" r="15"/>
  </g>

  <!-- blessing: soft light falling from the feather onto the flask -->
  <ellipse cx="512" cy="400" rx="300" ry="220" fill="url(#halo)"/>

  <!-- potion in an Erlenmeyer flask -->
  <g clip-path="url(#body)">
    <path d="M300 660 C 380 640, 440 680, 512 660 S 650 640, 720 664 L 720 830 L 300 830 Z" fill="url(#liquid)"/>
  </g>
  <g fill="none" stroke="#e9e6df" stroke-linejoin="round" stroke-linecap="round">
    <path d="M474 420 L 474 520 L 340 790 Q 330 812 354 812 L 670 812 Q 694 812 684 790 L 550 520 L 550 420" stroke-width="22"/>
    <path d="M452 414 L 572 414" stroke-width="26"/>
    <path d="M410 700 L 456 610" stroke-width="12" stroke-opacity="0.45"/>
  </g>

  <!-- the feather, drifting down almost level -->
  <g transform="translate(512 300) rotate(-20)" filter="url(#glow)">
    <path d="M-215 4 C -150 -40, -40 -62, 80 -54 C 150 -48, 196 -30, 222 -4 C 190 22, 120 44, 30 46 C -70 48, -160 34, -215 4 Z" fill="url(#ember)"/>
    <path d="M-235 6 C -100 -6, 60 -10, 220 -4" fill="none" stroke="#fff2c8" stroke-width="8" stroke-linecap="round"/>
    <g clip-path="url(#vane)" stroke="#1e1e20" stroke-width="9" stroke-linecap="round">
      <path d="M60 -80 L 0 -10"/><path d="M-50 70 L -110 8"/>
    </g>
  </g>

  <!-- PS1-style twinkles -->
  <g fill="#fff6d8" filter="url(#glow)">
    <use href="#spark" transform="translate(760 210) scale(30)"/>
    <use href="#spark" transform="translate(300 250) scale(20)"/>
    <use href="#spark" transform="translate(620 400) scale(16)"/>
    <use href="#spark" transform="translate(430 470) scale(12)"/>
    <use href="#spark" transform="translate(560 540) scale(9)"/>
  </g>
</svg>
